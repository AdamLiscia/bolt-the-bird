[workspace]
resolver = "2"
members = ["bolt-core", "bolt-cards", "bolt-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AdamLiscia/bolt-the-bird"
rust-version = "1.92"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
